<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>羊羊 AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 左侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" fill="#c8956a" opacity="0.15"/>
            <ellipse cx="12" cy="13" rx="7" ry="6" fill="#c8956a" opacity="0.3"/>
            <circle cx="9" cy="10" r="2.5" fill="#c8956a" opacity="0.5"/>
            <circle cx="15" cy="10" r="2.5" fill="#c8956a" opacity="0.5"/>
            <circle cx="12" cy="8" r="3" fill="#c8956a" opacity="0.5"/>
          </svg>
          <span class="logo-text">羊羊 AI</span>
        </div>
        <button class="icon-btn" id="toggle-sidebar" title="收起侧栏">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
        </button>
      </div>

      <button class="new-chat-btn" id="new-chat-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        新对话
      </button>

      <div class="history-section">
        <div class="history-label">最近对话</div>
        <div class="history-list" id="history-list">
          <!-- 动态插入 -->
        </div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main" id="main">
      <!-- 顶部栏 -->
      <header class="topbar">
        <button class="icon-btn" id="open-sidebar" title="展开侧栏" style="display:none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="spacer"></div>
        <button class="new-chat-icon-btn" id="new-chat-top" title="新对话">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
        </button>
      </header>

      <!-- 对话内容区 -->
      <div class="chat-container" id="chat-container">
        <!-- 欢迎页 -->
        <div class="welcome" id="welcome">
          <div class="sheep-wrap">
            <img src="sheep.png" alt="羊羊" class="sheep-img" id="sheep-img" />
            <!-- SVG fallback，若图片加载失败则显示 -->
            <svg class="sheep-svg" id="sheep-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="display:none;">
              <!-- 身体 -->
              <ellipse cx="100" cy="140" rx="55" ry="40" fill="white" stroke="#ccc" stroke-width="2"/>
              <!-- 羊毛团 -->
              <circle cx="100" cy="95" r="42" fill="white" stroke="#ccc" stroke-width="2"/>
              <circle cx="72" cy="85" r="28" fill="white" stroke="#ccc" stroke-width="2"/>
              <circle cx="128" cy="85" r="28" fill="white" stroke="#ccc" stroke-width="2"/>
              <circle cx="85" cy="68" r="22" fill="white" stroke="#ccc" stroke-width="2"/>
              <circle cx="115" cy="68" r="22" fill="white" stroke="#ccc" stroke-width="2"/>
              <circle cx="100" cy="62" r="20" fill="white" stroke="#ccc" stroke-width="2"/>
              <!-- 脸 -->
              <ellipse cx="100" cy="105" rx="28" ry="25" fill="white" stroke="#ccc" stroke-width="1.5"/>
              <!-- 眼睛 -->
              <ellipse cx="91" cy="100" rx="4" ry="5" fill="#333"/>
              <ellipse cx="109" cy="100" rx="4" ry="5" fill="#333"/>
              <circle cx="92" cy="99" r="1.5" fill="white"/>
              <circle cx="110" cy="99" r="1.5" fill="white"/>
              <!-- 腮红 -->
              <ellipse cx="84" cy="109" rx="6" ry="4" fill="#ffb6c1" opacity="0.7"/>
              <ellipse cx="116" cy="109" rx="6" ry="4" fill="#ffb6c1" opacity="0.7"/>
              <!-- 嘴 -->
              <path d="M95 114 Q100 119 105 114" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
              <!-- 腿 -->
              <rect x="76" y="170" width="12" height="20" rx="6" fill="white" stroke="#ccc" stroke-width="1.5"/>
              <rect x="112" y="170" width="12" height="20" rx="6" fill="white" stroke="#ccc" stroke-width="1.5"/>
              <rect x="88" y="172" width="12" height="18" rx="6" fill="white" stroke="#ccc" stroke-width="1.5"/>
              <rect x="100" y="172" width="12" height="18" rx="6" fill="white" stroke="#ccc" stroke-width="1.5"/>
              <!-- 爱心 -->
              <path d="M68 58 C68 54 62 50 58 54 C54 58 58 64 68 70 C78 64 82 58 78 54 C74 50 68 54 68 58Z" fill="#ff6b8a" opacity="0.85"/>
              <path d="M82 48 C82 45 77 42 74 45 C71 48 74 53 82 58 C90 53 93 48 90 45 C87 42 82 45 82 48Z" fill="#ff6b8a" opacity="0.85"/>
            </svg>
          </div>
        </div>

        <!-- 消息列表 -->
        <div class="messages" id="messages"></div>
      </div>

      <!-- 输入区 -->
      <div class="input-area">
        <div class="input-box">
          <textarea
            id="user-input"
            placeholder="消息羊羊..."
            rows="1"
            maxlength="4000"
          ></textarea>
          <button class="send-btn" id="send-btn" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
